# Override dùng cho mọi server (staging + production).
#
# Biến cần có trong --env-file (compose substitution):
#   IMAGE_TAG, GHCR_OWNER, ASPNETCORE_ENVIRONMENT, ENV_DIR,
#   MSSQL_SA_PASSWORD, JWT_SECRET, SERVER_IP
#
# SERVER_IP: IP public/LAN của server (ví dụ: 192.168.100.60).
#   Dùng để Keycloak ghi đúng issuer vào token và các service
#   validate đúng issuer đó. Thiếu biến này → JWT bị reject 401.
#
# ENV_DIR trỏ tới thư mục chứa các file .env của từng service trên server:
#   Staging : ENV_DIR=/opt/hdos-staging
#   Prod    : ENV_DIR=/opt/hdos-prod
#
# Cấu trúc thư mục trên mỗi server:
#   ${ENV_DIR}/
#   ├── .env                  ← compose vars (IMAGE_TAG, MSSQL_SA_PASSWORD, SERVER_IP, ...)
#   ├── common.env            ← biến dùng chung inject vào container
#   ├── authservice.env       ← biến riêng AuthService
#   ├── orderservice.env      ← biến riêng OrderService
#   ├── notificationservice.env
#   ├── m01service.env
#   └── asyncgateway.env      ← biến riêng AsyncGateway

services:

  # sqlserver phải được override ở đây để nhận MSSQL_SA_PASSWORD từ common.env.
  # Nếu thiếu block này, sqlserver chỉ dùng giá trị default hardcode trong
  # docker-compose.yml → password không khớp với ConnectionStrings của services.
  sqlserver:
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"

  # Keycloak phải biết IP thật của server để ghi đúng issuer vào token.
  # Không set KC_HOSTNAME → issuer trong token = URL request đến Keycloak
  # → mỗi client dùng URL khác nhau → issuer loạn → 401 ở mọi service.
  keycloak:
    environment:
      KC_HOSTNAME: "${SERVER_IP}"
      KC_HTTP_PORT: "8080"

  authservice:
    image: ghcr.io/${GHCR_OWNER}/hdos-authservice:${IMAGE_TAG}
    build: !reset null
    env_file:
      - ${ENV_DIR}/common.env
      - ${ENV_DIR}/authservice.env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      Keycloak__Authority: "http://${SERVER_IP}:8080/realms/hdos"

  orderservice:
    image: ghcr.io/${GHCR_OWNER}/hdos-orderservice:${IMAGE_TAG}
    build: !reset null
    env_file:
      - ${ENV_DIR}/common.env
      - ${ENV_DIR}/orderservice.env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      Keycloak__Authority: "http://${SERVER_IP}:8080/realms/hdos"

  notificationservice:
    image: ghcr.io/${GHCR_OWNER}/hdos-notificationservice:${IMAGE_TAG}
    build: !reset null
    env_file:
      - ${ENV_DIR}/common.env
      - ${ENV_DIR}/notificationservice.env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      Keycloak__Authority: "http://${SERVER_IP}:8080/realms/hdos"

  m01service:
    image: ghcr.io/${GHCR_OWNER}/hdos-m01service:${IMAGE_TAG}
    build: !reset null
    env_file:
      - ${ENV_DIR}/common.env
      - ${ENV_DIR}/m01service.env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      Keycloak__Authority: "http://${SERVER_IP}:8080/realms/hdos"

  asyncgateway:
    image: ghcr.io/${GHCR_OWNER}/hdos-asyncgateway:${IMAGE_TAG}
    build: !reset null
    env_file:
      - ${ENV_DIR}/common.env
      - ${ENV_DIR}/asyncgateway.env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      Keycloak__Authority: "http://${SERVER_IP}:8080/realms/hdos"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
