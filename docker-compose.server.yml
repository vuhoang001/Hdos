# Override dùng cho mọi server (staging + production).
#
# Biến cần có trong --env-file (compose substitution):
#   IMAGE_TAG, GHCR_OWNER, ASPNETCORE_ENVIRONMENT, ENV_DIR,
#   MSSQL_SA_PASSWORD, POSTGRES_DM_PASSWORD, POSTGRES_DF_PASSWORD, POSTGRES_LH_PASSWORD, JWT_SECRET
#
# ENV_DIR trỏ tới thư mục chứa các file .env của từng service trên server:
#   Staging : ENV_DIR=/opt/hdos-staging
#   Prod    : ENV_DIR=/opt/hdos-prod
#
# Cấu trúc thư mục trên mỗi server:
#   ${ENV_DIR}/
#   ├── .env                      ← compose vars (IMAGE_TAG, MSSQL_SA_PASSWORD, POSTGRES_DM_PASSWORD, JWT_SECRET, ...)
#   ├── common.env                ← biến dùng chung inject vào container
#   ├── authservice.env           ← biến riêng AuthService
#   ├── orderservice.env          ← biến riêng OrderService
#   ├── notificationservice.env
#   ├── m01service.env
#   ├── asyncgateway.env          ← biến riêng AsyncGateway
#   ├── datamatchingservice.env   ← biến riêng DataMatchingService
#   └── lakehouseservice.env      ← biến riêng LakehouseService

services:

  # sqlserver phải được override ở đây để nhận MSSQL_SA_PASSWORD từ common.env.
  sqlserver:
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"

  # postgres-dm dùng riêng cho DataMatchingService, không expose port ra ngoài.
  postgres-dm:
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_DM_PASSWORD:-changeme}"
    ports: !reset []

  authservice:
    image: ${REGISTRY_IMAGE}/hdos-authservice:${IMAGE_TAG}
    build: !reset null
    env_file:
      - ${ENV_DIR}/common.env
      - ${ENV_DIR}/authservice.env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      Jwt__Secret: "${JWT_SECRET}"
      # Phase 4: AuthService gọi Superset Admin API
      Superset__BaseUrl: "http://superset:8088/"
      Superset__AdminUsername: "${SUPERSET_ADMIN_USERNAME:-admin}"
      Superset__AdminPassword: "${SUPERSET_ADMIN_PASSWORD}"
      Superset__PublicUrl: "${SUPERSET_PUBLIC_URL:-https://localhost:8444/}"

  notificationservice:
    image: ${REGISTRY_IMAGE}/hdos-notificationservice:${IMAGE_TAG}
    build: !reset null
    env_file:
      - ${ENV_DIR}/common.env
      - ${ENV_DIR}/notificationservice.env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      Jwt__Secret: "${JWT_SECRET}"

  asyncgateway:
    image: ${REGISTRY_IMAGE}/hdos-asyncgateway:${IMAGE_TAG}
    build: !reset null
    env_file:
      - ${ENV_DIR}/common.env
      - ${ENV_DIR}/asyncgateway.env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      Jwt__Secret: "${JWT_SECRET}"

  datamatchingservice:
    image: ${REGISTRY_IMAGE}/hdos-datamatchingservice:${IMAGE_TAG}
    build: !reset null
    env_file:
      - path: ${ENV_DIR}/common.env
        required: true
      - path: ${ENV_DIR}/datamatchingservice.env
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      Jwt__Secret: "${JWT_SECRET}"

  postgres-df:
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_DF_PASSWORD:-changeme}"
    ports: !reset []

  postgres-lh:
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_LH_PASSWORD:-changeme}"
    ports: !reset []

  dynamicformservice:
    image: ${REGISTRY_IMAGE}/hdos-dynamicformservice:${IMAGE_TAG}
    build: !reset null
    env_file:
      - path: ${ENV_DIR}/common.env
        required: true
      - path: ${ENV_DIR}/dynamicformservice.env
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      Jwt__Secret: "${JWT_SECRET}"

  lakehouseservice:
    image: ${REGISTRY_IMAGE}/hdos-lakehouseservice:${IMAGE_TAG}
    build: !reset null
    env_file:
      - path: ${ENV_DIR}/common.env
        required: true
      - path: ${ENV_DIR}/lakehouseservice.env
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      Jwt__Secret: "${JWT_SECRET}"

  # ── Superset (Phase 1: standalone BI behind nginx) ───────────────────────
  postgres-superset:
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_SUPERSET_PASSWORD:-changeme}"

  superset-init:
    image: ${REGISTRY_IMAGE}/hdos-superset:${IMAGE_TAG}
    build: !reset null
    environment:
      SUPERSET_SECRET_KEY: "${SUPERSET_SECRET_KEY}"
      SUPERSET_DATABASE_URI: "postgresql+psycopg2://superset_user:${POSTGRES_SUPERSET_PASSWORD}@postgres-superset:5432/SupersetDb"
      SUPERSET_ADMIN_USERNAME: "${SUPERSET_ADMIN_USERNAME:-admin}"
      SUPERSET_ADMIN_PASSWORD: "${SUPERSET_ADMIN_PASSWORD}"
      SUPERSET_ADMIN_EMAIL: "${SUPERSET_ADMIN_EMAIL:-admin@hdos.local}"

  superset:
    image: ${REGISTRY_IMAGE}/hdos-superset:${IMAGE_TAG}
    build: !reset null
    environment:
      SUPERSET_SECRET_KEY: "${SUPERSET_SECRET_KEY}"
      SUPERSET_DATABASE_URI: "postgresql+psycopg2://superset_user:${POSTGRES_SUPERSET_PASSWORD}@postgres-superset:5432/SupersetDb"
      SUPERSET_PUBLIC_URL: "${SUPERSET_PUBLIC_URL:-https://localhost:8444/}"
      # Phase 2: Hdos JWT secret cho Security Manager Python
      HDOS_JWT_SECRET: "${JWT_SECRET}"
      # Phase 4: CORS allowlist FE
      HDOS_FE_ORIGINS: "${HDOS_FE_ORIGINS:-https://localhost,http://localhost:4000}"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
