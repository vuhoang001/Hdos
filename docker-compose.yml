services:

  # ── Identity Provider ────────────────────────────────────────────────────────
  postgres-keycloak:
    image: postgres:16-alpine
    container_name: hdos-postgres-kc
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: "${KC_DB_PASSWORD:-keycloak_dev_pass}"
    volumes:
      - hdos-kcdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [hdos-net]

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: hdos-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://postgres-keycloak:5432/keycloak"
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: "${KC_DB_PASSWORD:-keycloak_dev_pass}"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KC_ADMIN_PASSWORD:-Admin1234!}"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    networks: [hdos-net]

  # ── Infrastructure ────────────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hdos-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Hdos!DevPass123}"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - hdos-sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${MSSQL_SA_PASSWORD:-Hdos!DevPass123}' -C -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 90s
    networks: [hdos-net]

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: hdos-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      retries: 10
    networks: [hdos-net]

  # ── Services ──────────────────────────────────────────────────────────────────
  authservice:
    image: hdos/authservice:latest
    build:
      context: .
      dockerfile: src/Services/AuthService/AuthService.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Kestrel__RestPort: 8080
      Kestrel__GrpcPort: 8081
      ConnectionStrings__AuthDb: "Server=sqlserver,1433;Database=AuthDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Hdos!DevPass123};TrustServerCertificate=True;Encrypt=False"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      Keycloak__Authority: "http://keycloak:8080/realms/hdos"
      Keycloak__Audience: "hdos-backend"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks: [hdos-net]

  orderservice:
    image: hdos/orderservice:latest
    build:
      context: .
      dockerfile: src/Services/OrderService/OrderService.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__OrderDb: "Server=sqlserver,1433;Database=OrderDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Hdos!DevPass123};TrustServerCertificate=True;Encrypt=False"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      Services__Auth__GrpcUrl: "http://authservice:8081"
      Keycloak__Authority: "http://keycloak:8080/realms/hdos"
      Keycloak__Audience: "hdos-backend"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      authservice:
        condition: service_started
    networks: [hdos-net]

  notificationservice:
    image: hdos/notificationservice:latest
    build:
      context: .
      dockerfile: src/Services/NotificationService/NotificationService.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__NotificationDb: "Server=sqlserver,1433;Database=NotificationDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Hdos!DevPass123};TrustServerCertificate=True;Encrypt=False"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      Keycloak__Authority: "http://keycloak:8080/realms/hdos"
      Keycloak__Audience: "hdos-backend"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [hdos-net]

  m01service:
    image: hdos/m01service:latest
    build:
      context: .
      dockerfile: src/Services/M01Service/M01Service.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__M01Db: "Server=sqlserver,1433;Database=M01Db;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Hdos!DevPass123};TrustServerCertificate=True;Encrypt=False"
      Keycloak__Authority: "http://keycloak:8080/realms/hdos"
      Keycloak__Audience: "hdos-backend"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks: [hdos-net]

  asyncgateway:
    image: hdos/asyncgateway:latest
    build:
      context: .
      dockerfile: src/ApiGateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      Keycloak__Authority: "http://keycloak:8080/realms/hdos"
      Keycloak__Audience: "hdos-backend"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks: [hdos-net]

  nginx:
    image: nginx:1.27-alpine
    container_name: hdos-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - authservice
      - orderservice
      - notificationservice
      - m01service
      - asyncgateway
    ports:
      - "5000:8080"
    networks: [hdos-net]

networks:
  hdos-net:
    driver: bridge

volumes:
  hdos-sqldata:
  hdos-kcdata:
