services:

  # ── Infrastructure ────────────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hdos-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Hdos!DevPass123}"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - hdos-sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${MSSQL_SA_PASSWORD:-Hdos!DevPass123}' -C -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 90s
    networks: [hdos-shared-net]

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: hdos-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      retries: 10
    networks: [hdos-shared-net]

  postgres-df:
    image: postgres:16-alpine
    container_name: hdos-postgres-df
    environment:
      POSTGRES_DB: DynamicFormDb
      POSTGRES_USER: df_user
      POSTGRES_PASSWORD: "${POSTGRES_DF_PASSWORD:-df_pass}"
    ports:
      - "5434:5432"
    volumes:
      - hdos-pgdata-df:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U df_user -d DynamicFormDb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [hdos-shared-net]

  postgres-lh:
    image: postgres:16-alpine
    container_name: hdos-postgres-lh
    environment:
      POSTGRES_DB: LakehouseDb
      POSTGRES_USER: lh_user
      POSTGRES_PASSWORD: "${POSTGRES_LH_PASSWORD:-lh_pass}"
    ports:
      - "5435:5432"
    volumes:
      - hdos-pgdata-lh:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lh_user -d LakehouseDb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [hdos-shared-net]

  postgres-dm:
    image: postgres:16-alpine
    container_name: hdos-postgres-dm
    environment:
      POSTGRES_DB: DataMatchingDb
      POSTGRES_USER: dm_user
      POSTGRES_PASSWORD: "${POSTGRES_DM_PASSWORD:-dm_pass}"
    ports:
      - "5433:5432"
    volumes:
      - hdos-pgdata-dm:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dm_user -d DataMatchingDb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [hdos-shared-net]

  # ── Services ──────────────────────────────────────────────────────────────────
  authservice:
    image: hdos/authservice:latest
    build:
      context: .
      dockerfile: src/Services/AuthService/AuthService.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Kestrel__RestPort: 8080
      Kestrel__GrpcPort: 8081
      ConnectionStrings__AuthDb: "Server=sqlserver,1433;Database=AuthDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Hdos!DevPass123};TrustServerCertificate=True;Encrypt=False"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      Jwt__Issuer: "hdos-auth"
      Jwt__Audience: "hdos-api"
      Jwt__Secret: "${JWT_SECRET:-DEV-INSECURE-SECRET-CHANGE-ME-AT-LEAST-32-CHARS}"
      Jwt__ExpiresMinutes: 480
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [hdos-shared-net]

  notificationservice:
    image: hdos/notificationservice:latest
    build:
      context: .
      dockerfile: src/Services/NotificationService/NotificationService.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__NotificationDb: "Server=sqlserver,1433;Database=NotificationDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Hdos!DevPass123};TrustServerCertificate=True;Encrypt=False"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      Jwt__Issuer: "hdos-auth"
      Jwt__Audience: "hdos-api"
      Jwt__Secret: "${JWT_SECRET:-DEV-INSECURE-SECRET-CHANGE-ME-AT-LEAST-32-CHARS}"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [hdos-shared-net]

  dynamicformservice:
    image: hdos/dynamicformservice:latest
    build:
      context: .
      dockerfile: src/Services/DynamicFormService/DynamicFormService.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DynamicFormDb: "Host=postgres-df;Port=5432;Database=DynamicFormDb;Username=df_user;Password=${POSTGRES_DF_PASSWORD:-df_pass}"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      Jwt__Issuer: "hdos-auth"
      Jwt__Audience: "hdos-api"
      Jwt__Secret: "${JWT_SECRET:-DEV-INSECURE-SECRET-CHANGE-ME-AT-LEAST-32-CHARS}"
    depends_on:
      postgres-df:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [hdos-shared-net]

  lakehouseservice:
    image: hdos/lakehouseservice:latest
    build:
      context: .
      dockerfile: src/Services/LakehouseService/LakehouseService.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__LakehouseDb: "Host=postgres-lh;Port=5432;Database=LakehouseDb;Username=lh_user;Password=${POSTGRES_LH_PASSWORD:-lh_pass}"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      Jwt__Issuer: "hdos-auth"
      Jwt__Audience: "hdos-api"
      Jwt__Secret: "${JWT_SECRET:-DEV-INSECURE-SECRET-CHANGE-ME-AT-LEAST-32-CHARS}"
    depends_on:
      postgres-lh:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [hdos-shared-net]

  datamatchingservice:
    image: hdos/datamatchingservice:latest
    build:
      context: .
      dockerfile: src/Services/DataMatchingService/DataMatchingService.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DataMatchingDb: "Host=postgres-dm;Port=5432;Database=DataMatchingDb;Username=dm_user;Password=${POSTGRES_DM_PASSWORD:-dm_pass}"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      Jwt__Issuer: "hdos-auth"
      Jwt__Audience: "hdos-api"
      Jwt__Secret: "${JWT_SECRET:-DEV-INSECURE-SECRET-CHANGE-ME-AT-LEAST-32-CHARS}"
      Matching__WorkerIntervalSeconds: 30
    depends_on:
      postgres-dm:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [hdos-shared-net]

  asyncgateway:
    image: hdos/asyncgateway:latest
    build:
      context: .
      dockerfile: src/ApiGateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      Jwt__Issuer: "hdos-auth"
      Jwt__Audience: "hdos-api"
      Jwt__Secret: "${JWT_SECRET:-DEV-INSECURE-SECRET-CHANGE-ME-AT-LEAST-32-CHARS}"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks: [hdos-shared-net]

  nginx:
    image: nginx:1.27-alpine
    container_name: hdos-nginx
    entrypoint: ["/bin/sh", "/etc/nginx/entrypoint.sh"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/entrypoint.sh:/etc/nginx/entrypoint.sh:ro
      - ./nginx/swagger-hub.html:/etc/nginx/swagger-hub.html:ro
      - hdos-nginx-ssl:/etc/nginx/ssl
    depends_on:
      - authservice
      - notificationservice
      - datamatchingservice
      - dynamicformservice
      - lakehouseservice
      - asyncgateway
    ports:
      - "5000:8080"
      - "8443:8443"
    networks: [hdos-shared-net]

networks:
  hdos-shared-net:
    external: true

volumes:
  hdos-sqldata:
  hdos-pgdata-dm:
  hdos-pgdata-df:
  hdos-pgdata-lh:
  hdos-nginx-ssl:
