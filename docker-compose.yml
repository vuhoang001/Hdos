services:

  # ── Infrastructure ────────────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hdos-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Hdos!DevPass123}"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - hdos-sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${MSSQL_SA_PASSWORD:-Hdos!DevPass123}' -C -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 90s
    networks: [hdos-net]

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: hdos-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      retries: 10
    networks: [hdos-net]

  # ── Services ──────────────────────────────────────────────────────────────────
  authservice:
    image: hdos/authservice:latest
    build:
      context: .
      dockerfile: src/Services/AuthService/AuthService.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Kestrel__RestPort: 8080
      Kestrel__GrpcPort: 8081
      ConnectionStrings__AuthDb: "Server=sqlserver,1433;Database=AuthDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Hdos!DevPass123};TrustServerCertificate=True;Encrypt=False"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      Jwt__Issuer: "hdos-auth"
      Jwt__Audience: "hdos-api"
      Jwt__Secret: "${JWT_SECRET:-DEV-INSECURE-SECRET-CHANGE-ME-AT-LEAST-32-CHARS}"
      Jwt__ExpiresMinutes: 480
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [hdos-net]

  orderservice:
    image: hdos/orderservice:latest
    build:
      context: .
      dockerfile: src/Services/OrderService/OrderService.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__OrderDb: "Server=sqlserver,1433;Database=OrderDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Hdos!DevPass123};TrustServerCertificate=True;Encrypt=False"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      Services__Auth__GrpcUrl: "http://authservice:8081"
      Jwt__Issuer: "hdos-auth"
      Jwt__Audience: "hdos-api"
      Jwt__Secret: "${JWT_SECRET:-DEV-INSECURE-SECRET-CHANGE-ME-AT-LEAST-32-CHARS}"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      authservice:
        condition: service_started
    networks: [hdos-net]

  notificationservice:
    image: hdos/notificationservice:latest
    build:
      context: .
      dockerfile: src/Services/NotificationService/NotificationService.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__NotificationDb: "Server=sqlserver,1433;Database=NotificationDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Hdos!DevPass123};TrustServerCertificate=True;Encrypt=False"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      Jwt__Issuer: "hdos-auth"
      Jwt__Audience: "hdos-api"
      Jwt__Secret: "${JWT_SECRET:-DEV-INSECURE-SECRET-CHANGE-ME-AT-LEAST-32-CHARS}"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [hdos-net]

  m01service:
    image: hdos/m01service:latest
    build:
      context: .
      dockerfile: src/Services/M01Service/M01Service.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__M01Db: "Server=sqlserver,1433;Database=M01Db;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Hdos!DevPass123};TrustServerCertificate=True;Encrypt=False"
      Jwt__Issuer: "hdos-auth"
      Jwt__Audience: "hdos-api"
      Jwt__Secret: "${JWT_SECRET:-DEV-INSECURE-SECRET-CHANGE-ME-AT-LEAST-32-CHARS}"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks: [hdos-net]

  asyncgateway:
    image: hdos/asyncgateway:latest
    build:
      context: .
      dockerfile: src/ApiGateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      Jwt__Issuer: "hdos-auth"
      Jwt__Audience: "hdos-api"
      Jwt__Secret: "${JWT_SECRET:-DEV-INSECURE-SECRET-CHANGE-ME-AT-LEAST-32-CHARS}"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks: [hdos-net]

  nginx:
    image: nginx:1.27-alpine
    container_name: hdos-nginx
    entrypoint: ["/bin/sh", "/etc/nginx/entrypoint.sh"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/entrypoint.sh:/etc/nginx/entrypoint.sh:ro
      - hdos-nginx-ssl:/etc/nginx/ssl
    depends_on:
      - authservice
      - orderservice
      - notificationservice
      - m01service
      - asyncgateway
    ports:
      - "5000:8080"
      - "8443:8443"
    networks: [hdos-net]

networks:
  hdos-net:
    driver: bridge

volumes:
  hdos-sqldata:
  hdos-nginx-ssl:
