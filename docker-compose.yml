services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hdos-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Hdos!Pass123"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - hdos-sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Hdos!Pass123' -C -Q 'SELECT 1' || exit 1"]
      interval: 15s
      retries: 10
      start_period: 30s
    networks: [hdos-net]

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: hdos-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      retries: 10
    networks: [hdos-net]

  authservice:
    image: hdos/authservice:latest
    build:
      context: .
      dockerfile: src/Services/AuthService/AuthService.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Override Development defaults so containers always use 8080/8081 internally.
      Kestrel__RestPort: 8080
      Kestrel__GrpcPort: 8081
      ConnectionStrings__AuthDb: "Server=sqlserver,1433;Database=AuthDb;User Id=sa;Password=Hdos!Pass123;TrustServerCertificate=True;Encrypt=False"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "5101:8080"   # REST
      - "5111:8081"   # gRPC
    networks: [hdos-net]

  orderservice:
    image: hdos/orderservice:latest
    build:
      context: .
      dockerfile: src/Services/OrderService/OrderService.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__OrderDb: "Server=sqlserver,1433;Database=OrderDb;User Id=sa;Password=Hdos!Pass123;TrustServerCertificate=True;Encrypt=False"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      Services__Auth__GrpcUrl: "http://authservice:8081"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      authservice:
        condition: service_started
    ports:
      - "5102:8080"
    networks: [hdos-net]

  notificationservice:
    image: hdos/notificationservice:latest
    build:
      context: .
      dockerfile: src/Services/NotificationService/NotificationService.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__NotificationDb: "Server=sqlserver,1433;Database=NotificationDb;User Id=sa;Password=Hdos!Pass123;TrustServerCertificate=True;Encrypt=False"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "5103:8080"
    networks: [hdos-net]

  apigateway:
    image: hdos/apigateway:latest
    build:
      context: .
      dockerfile: src/ApiGateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    depends_on:
      - authservice
      - orderservice
      - notificationservice
    ports:
      - "5000:8080"
    networks: [hdos-net]

networks:
  hdos-net:
    driver: bridge

volumes:
  hdos-sqldata:
