# Khi thêm service mới: thêm một block tương tự bên dưới.
# Mỗi service sẽ rebuild khi chính nó hoặc BuildingBlocks thay đổi.

authservice:
  - "src/Services/AuthService/**"
  - "src/BuildingBlocks/**"

notificationservice:
  - "src/Services/NotificationService/**"
  - "src/BuildingBlocks/**"

asyncgateway:
  - "src/ApiGateway/**"
  - "src/BuildingBlocks/**"

datamatchingservice:
  - "src/Services/DataMatchingService/**"
  - "src/BuildingBlocks/**"

dynamicformservice:
  - "src/Services/DynamicFormService/**"
  - "src/BuildingBlocks/**"

lakehouseservice:
  - "src/Services/LakehouseService/**"
  - "src/BuildingBlocks/**"

superset:
  - "superset/**"

