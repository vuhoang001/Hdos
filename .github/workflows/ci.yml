name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  # ─── Job 1: Phát hiện service nào thay đổi ────────────────────────────────
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed services
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: .github/path-filters.yml

  # ─── Job 2: Chạy toàn bộ test suite ──────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/*.trx"

  # ─── Job 3: Build Docker image và push lên GHCR ──────────────────────────
  # Chỉ chạy với các service thay đổi, chạy song song nhau.
  build-push:
    name: Build & Push (${{ matrix.service }})
    needs: [detect-changes, test]
    if: |
      needs.detect-changes.outputs.changed != '[]' &&
      needs.detect-changes.outputs.changed != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.changed) }}

    steps:
      - uses: actions/checkout@v4

      # Đọc dockerfile và context từ services.json theo tên service
      - name: Load service config
        id: config
        run: |
          dockerfile=$(jq -r '."${{ matrix.service }}".dockerfile' services.json)
          context=$(jq -r '."${{ matrix.service }}".context' services.json)
          echo "dockerfile=$dockerfile" >> $GITHUB_OUTPUT
          echo "context=$context" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.config.outputs.context }}
          file: ${{ steps.config.outputs.dockerfile }}
          # Chỉ push khi merge vào main, PR chỉ build để kiểm tra
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/hdos-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/hdos-${{ matrix.service }}:${{ github.sha }}
          # Cache layer Docker giữa các lần build → nhanh hơn nhiều
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
