name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  # Bấm nút thủ công để force build tất cả service (dùng lần đầu hoặc khi cần rebuild)
  workflow_dispatch:
    inputs:
      force_build_all:
        description: "Build tất cả service (bỏ qua detect-changes)"
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io

jobs:
  # ─── Job 1: Phát hiện service nào thay đổi ────────────────────────────────
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed services
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: .github/path-filters.yml

  # ─── Job 1b: Quyết định danh sách service cần build ──────────────────────
  # workflow_dispatch → build tất cả
  # push              → chỉ build service có thay đổi; service không đổi sẽ
  #                     được retag bởi job retag-unchanged (chỉ trên main)
  resolve-services:
    name: Resolve services to build
    needs: [detect-changes]
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.resolve.outputs.services }}
      should_build: ${{ steps.resolve.outputs.should_build }}
      unchanged_services: ${{ steps.resolve.outputs.unchanged_services }}
    steps:
      - id: resolve
        run: |
          ALL='["authservice","orderservice","notificationservice","m01service","asyncgateway"]'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "services=$ALL" >> $GITHUB_OUTPUT
            echo 'should_build=true' >> $GITHUB_OUTPUT
            echo 'unchanged_services=[]' >> $GITHUB_OUTPUT
          else
            CHANGED='${{ needs.detect-changes.outputs.changed }}'
            CHANGED="${CHANGED:-[]}"
            echo "services=$CHANGED" >> $GITHUB_OUTPUT
            if [ "$CHANGED" != "[]" ] && [ -n "$CHANGED" ]; then
              echo 'should_build=true' >> $GITHUB_OUTPUT
            else
              echo 'should_build=false' >> $GITHUB_OUTPUT
            fi
            UNCHANGED=$(echo "$ALL" | jq --argjson c "$CHANGED" '[.[] | select(. as $s | $c | index($s) | not)]')
            echo "unchanged_services=$UNCHANGED" >> $GITHUB_OUTPUT
          fi

  # ─── Job 2: Chạy toàn bộ test suite ──────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/*.trx"

  # ─── Job 3: Build Docker image và push lên GHCR ──────────────────────────
  # Không chạy cho PR.
  # dev / workflow_dispatch từ dev  → tag :dev-latest
  # main / workflow_dispatch từ main → tag :prod-latest
  build-push:
    name: Build & Push (${{ matrix.service }})
    needs: [resolve-services, test]
    if: |
      needs.resolve-services.outputs.should_build == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.resolve-services.outputs.services) }}

    steps:
      - uses: actions/checkout@v4

      - name: Load service config
        id: config
        run: |
          dockerfile=$(jq -r '."${{ matrix.service }}".dockerfile' services.json)
          context=$(jq -r '."${{ matrix.service }}".context' services.json)
          echo "dockerfile=$dockerfile" >> $GITHUB_OUTPUT
          echo "context=$context" >> $GITHUB_OUTPUT

      # dev → dev-latest | main → prod-latest
      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "env_tag=prod-latest" >> $GITHUB_OUTPUT
          else
            echo "env_tag=dev-latest" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.config.outputs.context }}
          file: ${{ steps.config.outputs.dockerfile }}
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/hdos-${{ matrix.service }}:${{ steps.tag.outputs.env_tag }}
            ghcr.io/${{ github.repository_owner }}/hdos-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  # ─── Job 4: Re-tag service không đổi với SHA mới (chỉ trên main) ─────────
  # Dùng crane cp để copy manifest prod-latest → SHA mới, không cần pull image.
  # Đảm bảo CD luôn tìm thấy image theo SHA dù service không được rebuild.
  retag-unchanged:
    name: Re-tag unchanged (${{ matrix.service }})
    needs: [resolve-services, test]
    if: |
      github.ref_name == 'main' &&
      github.event_name == 'push' &&
      needs.resolve-services.outputs.unchanged_services != '[]'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.resolve-services.outputs.unchanged_services) }}
    steps:
      - name: Set up crane
        uses: imjasonh/setup-crane@v0.4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            crane auth login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Copy prod-latest → SHA
        run: |
          SRC="ghcr.io/${{ github.repository_owner }}/hdos-${{ matrix.service }}:prod-latest"
          DST="ghcr.io/${{ github.repository_owner }}/hdos-${{ matrix.service }}:${{ github.sha }}"
          echo "Copying $SRC → $DST"
          crane cp "$SRC" "$DST"
