name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, staging]

jobs:
  # ─── Staging: tự động khi CI pass trên nhánh staging ──────────────────────
  deploy-staging:
    name: Deploy → Staging
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'staging'
    runs-on: self-hosted
    environment: staging
    timeout-minutes: 240
    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Prepare env files
        env:
          ENV_DIR: /opt/hdos-staging
        run: |
          # Tạo file env còn thiếu để compose không lỗi khi service mới được thêm vào.
          # Operator cần tự điền giá trị thực sau khi deploy lần đầu.
          for svc in asyncgateway datamatchingservice; do
            f="${ENV_DIR}/${svc}.env"
            if [ ! -f "$f" ]; then
              echo "⚠️  $f not found — creating empty file. Set real values on server."
              touch "$f"
            fi
          done
          # Thêm POSTGRES_DM_PASSWORD vào .env nếu chưa có
          if ! grep -q "POSTGRES_DM_PASSWORD" "${ENV_DIR}/.env" 2>/dev/null; then
            echo "⚠️  POSTGRES_DM_PASSWORD not set — appending placeholder. Change on server!"
            echo "POSTGRES_DM_PASSWORD=changeme-set-real-password" >> "${ENV_DIR}/.env"
          fi
          # Thêm POSTGRES_DF_PASSWORD vào .env nếu chưa có
          if ! grep -q "POSTGRES_DF_PASSWORD" "${ENV_DIR}/.env" 2>/dev/null; then
            echo "⚠️  POSTGRES_DF_PASSWORD not set — appending placeholder. Change on server!"
            echo "POSTGRES_DF_PASSWORD=changeme-set-real-password" >> "${ENV_DIR}/.env"
          fi
          # Thêm POSTGRES_LH_PASSWORD vào .env nếu chưa có
          if ! grep -q "POSTGRES_LH_PASSWORD" "${ENV_DIR}/.env" 2>/dev/null; then
            echo "⚠️  POSTGRES_LH_PASSWORD not set — appending placeholder. Change on server!"
            echo "POSTGRES_LH_PASSWORD=changeme-set-real-password" >> "${ENV_DIR}/.env"
          fi
          # Superset (Phase 1)
          if ! grep -q "POSTGRES_SUPERSET_PASSWORD" "${ENV_DIR}/.env" 2>/dev/null; then
            echo "⚠️  POSTGRES_SUPERSET_PASSWORD not set — appending placeholder. Change on server!"
            echo "POSTGRES_SUPERSET_PASSWORD=changeme-set-real-password" >> "${ENV_DIR}/.env"
          fi
          if ! grep -q "SUPERSET_SECRET_KEY" "${ENV_DIR}/.env" 2>/dev/null; then
            echo "⚠️  SUPERSET_SECRET_KEY not set — appending placeholder. Change on server (>=32 chars random)!"
            echo "SUPERSET_SECRET_KEY=changeme-superset-secret-key-32-chars-x" >> "${ENV_DIR}/.env"
          fi
          if ! grep -q "SUPERSET_ADMIN_PASSWORD" "${ENV_DIR}/.env" 2>/dev/null; then
            echo "⚠️  SUPERSET_ADMIN_PASSWORD not set — appending placeholder. Change on server!"
            echo "SUPERSET_ADMIN_PASSWORD=changeme-superset-admin" >> "${ENV_DIR}/.env"
          fi

      - name: Deploy
        env:
          GHCR_OWNER: ${{ vars.GHCR_USER }}
          REGISTRY_IMAGE: ghcr.io/${{ vars.GHCR_USER }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          ENV_DIR: /opt/hdos-staging
          ASPNETCORE_ENVIRONMENT: Staging
        run: |
          set -euo pipefail

          echo "${{ secrets.GHCR_TOKEN }}" | \
            docker login ghcr.io -u "$GHCR_OWNER" --password-stdin

          COMPOSE_ARGS="--env-file ${ENV_DIR}/.env -f docker-compose.yml -f docker-compose.server.yml -f docker-compose.monitoring.yml"

          docker compose $COMPOSE_ARGS pull

          # Xóa container do compose quản lý
          docker compose $COMPOSE_ARGS down --remove-orphans --timeout 30
          # Xóa container hdos-* không có compose label (tạo tay, không bị down ở trên)
          docker ps -a --format '{{.Names}}' | grep '^hdos-' | xargs -r docker rm -f 2>/dev/null || true

          docker compose $COMPOSE_ARGS up -d

          docker image prune -f

      - name: Health check
        env:
          ENV_DIR: /opt/hdos-staging
        run: |
          sleep 15
          COMPOSE_ARGS="--env-file ${ENV_DIR}/.env -f docker-compose.yml -f docker-compose.server.yml -f docker-compose.monitoring.yml"
          FAILED=$(docker compose $COMPOSE_ARGS ps 2>/dev/null | grep -E ' Exit| Restarting' || true)
          if [ -n "$FAILED" ]; then
            echo "Containers in bad state:"
            docker compose $COMPOSE_ARGS ps
            docker compose $COMPOSE_ARGS logs --tail=100
            exit 1
          fi

      - name: Summary (success)
        if: success()
        run: |
          {
            echo "## ✅ Staging Deploy OK"
            echo "**SHA:** \`${{ github.event.workflow_run.head_sha }}\`  |  **Time:** $(date -u '+%Y-%m-%d %H:%M UTC')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary (failure)
        if: failure()
        run: |
          {
            echo "## ❌ Staging Deploy FAILED"
            echo "**SHA:** \`${{ github.event.workflow_run.head_sha }}\`  |  **Time:** $(date -u '+%Y-%m-%d %H:%M UTC')"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # ─── Production: tự động khi CI pass trên nhánh main ─────────────────────
  deploy-production:
    name: Deploy → Production
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: self-hosted
    environment: production
    timeout-minutes: 240
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Prepare env files
        env:
          ENV_DIR: /opt/hdos-prod
        run: |
          for svc in asyncgateway datamatchingservice; do
            f="${ENV_DIR}/${svc}.env"
            if [ ! -f "$f" ]; then
              echo "⚠️  $f not found — creating empty file. Set real values on server."
              touch "$f"
            fi
          done
          if ! grep -q "POSTGRES_DM_PASSWORD" "${ENV_DIR}/.env" 2>/dev/null; then
            echo "⚠️  POSTGRES_DM_PASSWORD not set — appending placeholder. Change on server!"
            echo "POSTGRES_DM_PASSWORD=changeme-set-real-password" >> "${ENV_DIR}/.env"
          fi
          if ! grep -q "POSTGRES_DF_PASSWORD" "${ENV_DIR}/.env" 2>/dev/null; then
            echo "⚠️  POSTGRES_DF_PASSWORD not set — appending placeholder. Change on server!"
            echo "POSTGRES_DF_PASSWORD=changeme-set-real-password" >> "${ENV_DIR}/.env"
          fi
          # Thêm POSTGRES_LH_PASSWORD vào .env nếu chưa có
          if ! grep -q "POSTGRES_LH_PASSWORD" "${ENV_DIR}/.env" 2>/dev/null; then
            echo "⚠️  POSTGRES_LH_PASSWORD not set — appending placeholder. Change on server!"
            echo "POSTGRES_LH_PASSWORD=changeme-set-real-password" >> "${ENV_DIR}/.env"
          fi
          # Superset (Phase 1)
          if ! grep -q "POSTGRES_SUPERSET_PASSWORD" "${ENV_DIR}/.env" 2>/dev/null; then
            echo "⚠️  POSTGRES_SUPERSET_PASSWORD not set — appending placeholder. Change on server!"
            echo "POSTGRES_SUPERSET_PASSWORD=changeme-set-real-password" >> "${ENV_DIR}/.env"
          fi
          if ! grep -q "SUPERSET_SECRET_KEY" "${ENV_DIR}/.env" 2>/dev/null; then
            echo "⚠️  SUPERSET_SECRET_KEY not set — appending placeholder. Change on server (>=32 chars random)!"
            echo "SUPERSET_SECRET_KEY=changeme-superset-secret-key-32-chars-x" >> "${ENV_DIR}/.env"
          fi
          if ! grep -q "SUPERSET_ADMIN_PASSWORD" "${ENV_DIR}/.env" 2>/dev/null; then
            echo "⚠️  SUPERSET_ADMIN_PASSWORD not set — appending placeholder. Change on server!"
            echo "SUPERSET_ADMIN_PASSWORD=changeme-superset-admin" >> "${ENV_DIR}/.env"
          fi

      - name: Deploy
        env:
          GHCR_OWNER: ${{ vars.GHCR_USER }}
          REGISTRY_IMAGE: ghcr.io/${{ vars.GHCR_USER }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          ENV_DIR: /opt/hdos-prod
          ASPNETCORE_ENVIRONMENT: Production
        run: |
          set -euo pipefail

          echo "${{ secrets.GHCR_TOKEN }}" | \
            docker login ghcr.io -u "$GHCR_OWNER" --password-stdin

          COMPOSE_ARGS="--env-file ${ENV_DIR}/.env -f docker-compose.yml -f docker-compose.server.yml -f docker-compose.monitoring.yml"

          docker compose $COMPOSE_ARGS pull

          # Xóa container do compose quản lý
          docker compose $COMPOSE_ARGS down --remove-orphans --timeout 30
          # Xóa container hdos-* không có compose label (tạo tay, không bị down ở trên)
          docker ps -a --format '{{.Names}}' | grep '^hdos-' | xargs -r docker rm -f 2>/dev/null || true

          docker compose $COMPOSE_ARGS up -d

          docker image prune -f

      - name: Health check
        env:
          ENV_DIR: /opt/hdos-prod
        run: |
          sleep 15
          COMPOSE_ARGS="--env-file ${ENV_DIR}/.env -f docker-compose.yml -f docker-compose.server.yml -f docker-compose.monitoring.yml"
          FAILED=$(docker compose $COMPOSE_ARGS ps 2>/dev/null | grep -E ' Exit| Restarting' || true)
          if [ -n "$FAILED" ]; then
            echo "Containers in bad state:"
            docker compose $COMPOSE_ARGS ps
            docker compose $COMPOSE_ARGS logs --tail=100
            exit 1
          fi

      - name: Summary (success)
        if: success()
        run: |
          {
            echo "## ✅ Production Deploy OK"
            echo "**SHA:** \`${{ github.event.workflow_run.head_sha }}\`  |  **Time:** $(date -u '+%Y-%m-%d %H:%M UTC')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary (failure)
        if: failure()
        run: |
          {
            echo "## ❌ Production Deploy FAILED"
            echo "**SHA:** \`${{ github.event.workflow_run.head_sha }}\`  |  **Time:** $(date -u '+%Y-%m-%d %H:%M UTC')"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
