name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, staging]

jobs:
  # ─── Staging: tự động khi CI pass trên nhánh staging ──────────────────────
  deploy-staging:
    name: Deploy → Staging
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'staging'
    runs-on: self-hosted
    environment: staging
    timeout-minutes: 15
    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy
        env:
          GHCR_OWNER: ${{ vars.GHCR_USER }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          ENV_DIR: /opt/hdos-staging
          ASPNETCORE_ENVIRONMENT: Staging
        run: |
          set -euo pipefail

          echo "${{ secrets.GHCR_TOKEN }}" | \
            docker login ghcr.io -u "$GHCR_OWNER" --password-stdin

          COMPOSE_ARGS="--env-file ${ENV_DIR}/.env -f docker-compose.yml -f docker-compose.server.yml -f docker-compose.monitoring.yml"

          docker compose $COMPOSE_ARGS pull

          docker compose $COMPOSE_ARGS up -d --remove-orphans --force-recreate

          docker image prune -f

      - name: Health check
        env:
          ENV_DIR: /opt/hdos-staging
        run: |
          sleep 15
          COMPOSE_ARGS="--env-file ${ENV_DIR}/.env -f docker-compose.yml -f docker-compose.server.yml -f docker-compose.monitoring.yml"
          FAILED=$(docker compose $COMPOSE_ARGS ps 2>/dev/null | grep -E ' Exit| Restarting' || true)
          if [ -n "$FAILED" ]; then
            echo "Containers in bad state:"
            docker compose $COMPOSE_ARGS ps
            docker compose $COMPOSE_ARGS logs --tail=100
            exit 1
          fi

      - name: Summary (success)
        if: success()
        run: |
          {
            echo "## ✅ Staging Deploy OK"
            echo "**SHA:** \`${{ github.event.workflow_run.head_sha }}\`  |  **Time:** $(date -u '+%Y-%m-%d %H:%M UTC')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary (failure)
        if: failure()
        run: |
          {
            echo "## ❌ Staging Deploy FAILED"
            echo "**SHA:** \`${{ github.event.workflow_run.head_sha }}\`  |  **Time:** $(date -u '+%Y-%m-%d %H:%M UTC')"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # ─── Production: tự động khi CI pass trên nhánh main ─────────────────────
  deploy-production:
    name: Deploy → Production
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: self-hosted
    environment: production
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy
        env:
          GHCR_OWNER: ${{ vars.GHCR_USER }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          ENV_DIR: /opt/hdos-prod
          ASPNETCORE_ENVIRONMENT: Production
        run: |
          set -euo pipefail

          echo "${{ secrets.GHCR_TOKEN }}" | \
            docker login ghcr.io -u "$GHCR_OWNER" --password-stdin

          COMPOSE_ARGS="--env-file ${ENV_DIR}/.env -f docker-compose.yml -f docker-compose.server.yml -f docker-compose.monitoring.yml"

          docker compose $COMPOSE_ARGS pull

          docker compose $COMPOSE_ARGS up -d --remove-orphans --force-recreate

          docker image prune -f

      - name: Health check
        env:
          ENV_DIR: /opt/hdos-prod
        run: |
          sleep 15
          COMPOSE_ARGS="--env-file ${ENV_DIR}/.env -f docker-compose.yml -f docker-compose.server.yml -f docker-compose.monitoring.yml"
          FAILED=$(docker compose $COMPOSE_ARGS ps 2>/dev/null | grep -E ' Exit| Restarting' || true)
          if [ -n "$FAILED" ]; then
            echo "Containers in bad state:"
            docker compose $COMPOSE_ARGS ps
            docker compose $COMPOSE_ARGS logs --tail=100
            exit 1
          fi

      - name: Summary (success)
        if: success()
        run: |
          {
            echo "## ✅ Production Deploy OK"
            echo "**SHA:** \`${{ github.event.workflow_run.head_sha }}\`  |  **Time:** $(date -u '+%Y-%m-%d %H:%M UTC')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary (failure)
        if: failure()
        run: |
          {
            echo "## ❌ Production Deploy FAILED"
            echo "**SHA:** \`${{ github.event.workflow_run.head_sha }}\`  |  **Time:** $(date -u '+%Y-%m-%d %H:%M UTC')"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
