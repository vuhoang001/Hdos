name: CD

on:
  # ── Tự động: CI pass trên nhánh dev → deploy staging ─────────────────────
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev]

  # ── Thủ công: chỉ dùng nút "Run workflow" trên GitHub để deploy production ─
  workflow_dispatch:
    inputs:
      sha:
        description: "SHA cụ thể cần deploy (để trống = HEAD của main)"
        required: false
        default: ""

jobs:
  # ─── Staging: tự động sau mỗi lần CI trên nhánh dev thành công ────────────
  deploy-staging:
    name: Deploy → Staging (auto)
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted
    environment: staging

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy
        env:
          GHCR_OWNER: ${{ vars.GHCR_USER }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          ENV_DIR: /opt/hdos-staging
          ASPNETCORE_ENVIRONMENT: Staging
        run: |
          set -e

          echo "${{ secrets.GHCR_TOKEN }}" | \
            docker login ghcr.io -u "$GHCR_OWNER" --password-stdin

          docker compose \
            --env-file "${ENV_DIR}/.env" \
            -f docker-compose.yml \
            -f docker-compose.server.yml \
            -f docker-compose.monitoring.yml \
            pull

          docker compose \
            --env-file "${ENV_DIR}/.env" \
            -f docker-compose.yml \
            -f docker-compose.server.yml \
            -f docker-compose.monitoring.yml \
            up -d --remove-orphans

          # nginx bind-mounts nginx.conf by inode; git checkout replaces the file
          # so the running container sees the old config until restarted.
          docker restart hdos-nginx

          docker image prune -f

      - name: Notify success
        if: success()
        run: echo "Staging deploy OK — $(date) — ${{ github.event.workflow_run.head_sha }}"

      - name: Notify failure
        if: failure()
        run: echo "Staging deploy FAILED — $(date)" && exit 1

  # ─── Production: CHỈ chạy khi bấm nút "Run workflow" thủ công ────────────
  deploy-production:
    name: Deploy → Production (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || 'main' }}

      - name: Deploy
        env:
          GHCR_OWNER: ${{ vars.GHCR_USER }}
          IMAGE_TAG: ${{ inputs.sha || 'prod-latest' }}
          ENV_DIR: /opt/hdos-prod
          ASPNETCORE_ENVIRONMENT: Production
        run: |
          set -e

          echo "${{ secrets.GHCR_TOKEN }}" | \
            docker login ghcr.io -u "$GHCR_OWNER" --password-stdin

          docker compose \
            --env-file "${ENV_DIR}/.env" \
            -f docker-compose.yml \
            -f docker-compose.server.yml \
            -f docker-compose.monitoring.yml \
            pull

          docker compose \
            --env-file "${ENV_DIR}/.env" \
            -f docker-compose.yml \
            -f docker-compose.server.yml \
            -f docker-compose.monitoring.yml \
            up -d --remove-orphans

          # nginx bind-mounts nginx.conf by inode; git checkout replaces the file
          # so the running container sees the old config until restarted.
          docker restart hdos-nginx

          docker image prune -f

      - name: Notify success
        if: success()
        run: echo "Production deploy OK — $(date) — SHA=${{ inputs.sha || 'prod-latest' }}"

      - name: Notify failure
        if: failure()
        run: echo "Production deploy FAILED — $(date)" && exit 1
