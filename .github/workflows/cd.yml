name: CD

on:
  # Tự động chạy sau khi CI thành công trên nhánh main
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

  # Cho phép trigger thủ công (rollback, hotfix...)
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Ubuntu
    # Chỉ deploy khi CI pass
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        env:
          GHCR_OWNER: ${{ vars.GHCR_USER }}
        run: |
          set -e

          # Đăng nhập GHCR
          echo "${{ secrets.GHCR_TOKEN }}" | \
            docker login ghcr.io -u "${{ vars.GHCR_USER }}" --password-stdin

          # Pull image mới nhất cho tất cả services
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            --env-file /opt/hdos/.env \
            pull

          # Khởi động lại container nào có image mới, giữ nguyên cái khác
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            --env-file /opt/hdos/.env \
            up -d --remove-orphans

          # Dọn image cũ
          docker image prune -f

      - name: Notify success
        if: success()
        run: echo "Deploy thành công tại $(date)"

      - name: Notify failure
        if: failure()
        run: echo "Deploy thất bại tại $(date)" && exit 1
