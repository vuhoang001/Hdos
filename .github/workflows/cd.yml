name: CD

on:
  # ── Tự động: CI pass trên nhánh dev → deploy staging ─────────────────────
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev]

  # ── Thủ công: chỉ dùng nút "Run workflow" trên GitHub để deploy production ─
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch cần deploy lên production"
        required: true
        default: "main"
        type: choice
        options:
          - main
          - dev

jobs:
  # ─── Staging: tự động sau mỗi lần CI trên nhánh dev thành công ────────────
  deploy-staging:
    name: Deploy → Staging (auto)
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted
    environment: staging
    timeout-minutes: 15
    concurrency:
      group: deploy-staging
      cancel-in-progress: false   # queue, không cancel deploy đang chạy

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy
        env:
          GHCR_OWNER: ${{ vars.GHCR_USER }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          ENV_DIR: /opt/hdos-staging
          ASPNETCORE_ENVIRONMENT: Staging
        run: |
          set -euo pipefail

          echo "${{ secrets.GHCR_TOKEN }}" | \
            docker login ghcr.io -u "$GHCR_OWNER" --password-stdin

          COMPOSE_ARGS="--env-file ${ENV_DIR}/.env -f docker-compose.yml -f docker-compose.server.yml -f docker-compose.monitoring.yml"

          docker compose $COMPOSE_ARGS pull

          # Chỉ xóa container ở trạng thái exited/created để fix naming conflict,
          # không động vào container đang running → tránh downtime không cần thiết
          docker ps -a --filter status=exited --filter status=created \
            --format '{{.Names}}' | grep '^hdos-' | xargs -r docker rm -f

          docker compose $COMPOSE_ARGS up -d --remove-orphans

          # Reload nginx config — bind-mount thay đổi inode sau git checkout
          docker compose $COMPOSE_ARGS restart nginx

          docker image prune -f

      - name: Health check
        env:
          ENV_DIR: /opt/hdos-staging
        run: |
          sleep 15
          COMPOSE_ARGS="--env-file ${ENV_DIR}/.env -f docker-compose.yml -f docker-compose.server.yml -f docker-compose.monitoring.yml"
          FAILED=$(docker compose $COMPOSE_ARGS ps 2>/dev/null | grep -E ' Exit| Restarting' || true)
          if [ -n "$FAILED" ]; then
            echo "Containers in bad state:"
            docker compose $COMPOSE_ARGS ps
            docker compose $COMPOSE_ARGS logs --tail=100
            exit 1
          fi

      - name: Summary (success)
        if: success()
        run: |
          {
            echo "## ✅ Staging Deploy OK"
            echo "**SHA:** \`${{ github.event.workflow_run.head_sha }}\`  |  **Time:** $(date -u '+%Y-%m-%d %H:%M UTC')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary (failure)
        if: failure()
        run: |
          {
            echo "## ❌ Staging Deploy FAILED"
            echo "**SHA:** \`${{ github.event.workflow_run.head_sha }}\`  |  **Time:** $(date -u '+%Y-%m-%d %H:%M UTC')"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # ─── Production: CHỈ chạy khi bấm nút "Run workflow" thủ công ────────────
  deploy-production:
    name: Deploy → Production (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    environment: production
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false   # queue, không cancel deploy đang chạy

    steps:
      - name: Validate ref & resolve SHA
        id: sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REF="${{ inputs.ref }}"
          SHA=$(gh api "repos/${{ github.repository }}/commits/$REF" --jq '.sha' 2>/dev/null) || {
            echo "❌ Ref '$REF' không tồn tại. Nhập branch (main, dev), tag (v1.2.3), hoặc commit SHA."
            exit 1
          }
          echo "value=$SHA" >> "$GITHUB_OUTPUT"
          echo "✅ $REF → $SHA"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.value }}

      - name: Deploy
        env:
          GHCR_OWNER: ${{ vars.GHCR_USER }}
          IMAGE_TAG: ${{ steps.sha.outputs.value }}   # luôn là full SHA cụ thể
          ENV_DIR: /opt/hdos-prod
          ASPNETCORE_ENVIRONMENT: Production
        run: |
          set -euo pipefail

          echo "${{ secrets.GHCR_TOKEN }}" | \
            docker login ghcr.io -u "$GHCR_OWNER" --password-stdin

          COMPOSE_ARGS="--env-file ${ENV_DIR}/.env -f docker-compose.yml -f docker-compose.server.yml -f docker-compose.monitoring.yml"

          docker compose $COMPOSE_ARGS pull

          # Chỉ xóa container ở trạng thái exited/created để fix naming conflict,
          # không động vào container đang running → tránh downtime không cần thiết
          docker ps -a --filter status=exited --filter status=created \
            --format '{{.Names}}' | grep '^hdos-' | xargs -r docker rm -f

          docker compose $COMPOSE_ARGS up -d --remove-orphans

          # Reload nginx config — bind-mount thay đổi inode sau git checkout
          docker compose $COMPOSE_ARGS restart nginx

          docker image prune -f

      - name: Health check
        env:
          ENV_DIR: /opt/hdos-prod
        run: |
          sleep 15
          COMPOSE_ARGS="--env-file ${ENV_DIR}/.env -f docker-compose.yml -f docker-compose.server.yml -f docker-compose.monitoring.yml"
          FAILED=$(docker compose $COMPOSE_ARGS ps 2>/dev/null | grep -E ' Exit| Restarting' || true)
          if [ -n "$FAILED" ]; then
            echo "Containers in bad state:"
            docker compose $COMPOSE_ARGS ps
            docker compose $COMPOSE_ARGS logs --tail=100
            exit 1
          fi

      - name: Summary (success)
        if: success()
        run: |
          {
            echo "## ✅ Production Deploy OK"
            echo "**SHA:** \`${{ steps.sha.outputs.value }}\` (ref: \`${{ inputs.ref }}\`)  |  **Time:** $(date -u '+%Y-%m-%d %H:%M UTC')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary (failure)
        if: failure()
        run: |
          {
            echo "## ❌ Production Deploy FAILED"
            echo "**SHA:** \`${{ steps.sha.outputs.value }}\` (ref: \`${{ inputs.ref }}\`)  |  **Time:** $(date -u '+%Y-%m-%d %H:%M UTC')"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
