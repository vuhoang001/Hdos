name: CD

on:
  # ── Tự động: CI pass trên nhánh dev → deploy staging ─────────────────────
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev]

  # ── Thủ công: chỉ dùng nút "Run workflow" trên GitHub để deploy production ─
  workflow_dispatch: {}

jobs:
  # ─── Staging: tự động sau mỗi lần CI trên nhánh dev thành công ────────────
  deploy-staging:
    name: Deploy → Staging (auto)
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted
    environment: staging
    timeout-minutes: 15
    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy
        env:
          GHCR_OWNER: ${{ vars.GHCR_USER }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          ENV_DIR: /opt/hdos-staging
          ASPNETCORE_ENVIRONMENT: Staging
        run: |
          set -euo pipefail

          echo "${{ secrets.GHCR_TOKEN }}" | \
            docker login ghcr.io -u "$GHCR_OWNER" --password-stdin

          COMPOSE_ARGS="--env-file ${ENV_DIR}/.env -f docker-compose.yml -f docker-compose.server.yml -f docker-compose.monitoring.yml"

          docker compose $COMPOSE_ARGS pull

          # Chỉ xóa container ở trạng thái exited/created để fix naming conflict
          docker ps -a --filter status=exited --filter status=created \
            --format '{{.Names}}' | grep '^hdos-' | xargs -r docker rm -f

          docker compose $COMPOSE_ARGS up -d --remove-orphans

          # Reload nginx config — bind-mount thay đổi inode sau git checkout
          docker compose $COMPOSE_ARGS restart nginx

          docker image prune -f

          # Lưu SHA đã deploy staging thành công để production dùng lại
          echo "$IMAGE_TAG" > /opt/hdos-staging/.last-sha

      - name: Health check
        env:
          ENV_DIR: /opt/hdos-staging
        run: |
          sleep 15
          COMPOSE_ARGS="--env-file ${ENV_DIR}/.env -f docker-compose.yml -f docker-compose.server.yml -f docker-compose.monitoring.yml"
          FAILED=$(docker compose $COMPOSE_ARGS ps 2>/dev/null | grep -E ' Exit| Restarting' || true)
          if [ -n "$FAILED" ]; then
            echo "Containers in bad state:"
            docker compose $COMPOSE_ARGS ps
            docker compose $COMPOSE_ARGS logs --tail=100
            exit 1
          fi

      - name: Summary (success)
        if: success()
        run: |
          {
            echo "## ✅ Staging Deploy OK"
            echo "**SHA:** \`${{ github.event.workflow_run.head_sha }}\`  |  **Time:** $(date -u '+%Y-%m-%d %H:%M UTC')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary (failure)
        if: failure()
        run: |
          {
            echo "## ❌ Staging Deploy FAILED"
            echo "**SHA:** \`${{ github.event.workflow_run.head_sha }}\`  |  **Time:** $(date -u '+%Y-%m-%d %H:%M UTC')"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # ─── Production: CHỈ chạy khi bấm nút "Run workflow" thủ công ────────────
  deploy-production:
    name: Deploy → Production (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    environment: production
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Load staging SHA
        id: sha
        run: |
          SHA_FILE=/opt/hdos-staging/.last-sha
          if [ ! -f "$SHA_FILE" ]; then
            echo "❌ Chưa có staging deploy nào thành công. Deploy staging trước rồi mới promote production."
            exit 1
          fi
          SHA=$(cat "$SHA_FILE")
          echo "value=$SHA" >> "$GITHUB_OUTPUT"
          echo "✅ Promoting staging SHA: $SHA"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.value }}

      - name: Deploy
        env:
          GHCR_OWNER: ${{ vars.GHCR_USER }}
          IMAGE_TAG: ${{ steps.sha.outputs.value }}
          ENV_DIR: /opt/hdos-prod
          ASPNETCORE_ENVIRONMENT: Production
        run: |
          set -euo pipefail

          echo "${{ secrets.GHCR_TOKEN }}" | \
            docker login ghcr.io -u "$GHCR_OWNER" --password-stdin

          COMPOSE_ARGS="--env-file ${ENV_DIR}/.env -f docker-compose.yml -f docker-compose.server.yml -f docker-compose.monitoring.yml"

          docker compose $COMPOSE_ARGS pull

          # Chỉ xóa container ở trạng thái exited/created để fix naming conflict
          docker ps -a --filter status=exited --filter status=created \
            --format '{{.Names}}' | grep '^hdos-' | xargs -r docker rm -f

          docker compose $COMPOSE_ARGS up -d --remove-orphans

          # Reload nginx config — bind-mount thay đổi inode sau git checkout
          docker compose $COMPOSE_ARGS restart nginx

          docker image prune -f

      - name: Health check
        env:
          ENV_DIR: /opt/hdos-prod
        run: |
          sleep 15
          COMPOSE_ARGS="--env-file ${ENV_DIR}/.env -f docker-compose.yml -f docker-compose.server.yml -f docker-compose.monitoring.yml"
          FAILED=$(docker compose $COMPOSE_ARGS ps 2>/dev/null | grep -E ' Exit| Restarting' || true)
          if [ -n "$FAILED" ]; then
            echo "Containers in bad state:"
            docker compose $COMPOSE_ARGS ps
            docker compose $COMPOSE_ARGS logs --tail=100
            exit 1
          fi

      - name: Summary (success)
        if: success()
        run: |
          {
            echo "## ✅ Production Deploy OK"
            echo "**SHA:** \`${{ steps.sha.outputs.value }}\`  |  **Time:** $(date -u '+%Y-%m-%d %H:%M UTC')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary (failure)
        if: failure()
        run: |
          {
            echo "## ❌ Production Deploy FAILED"
            echo "**SHA:** \`${{ steps.sha.outputs.value }}\`  |  **Time:** $(date -u '+%Y-%m-%d %H:%M UTC')"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
