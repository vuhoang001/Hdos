events {
    worker_connections 1024;
}

http {
    # ── Access log format for Promtail parsing ────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    # ── WebSocket upgrade ─────────────────────────────────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── CORS origin whitelist ─────────────────────────────────────────────────
    # Reflect origin chỉ khi nằm trong whitelist — KHÔNG phải echo-all.
    # Thêm production domain khi deploy (ví dụ: "~^https://app\.example\.com$").
    map $http_origin $cors_origin {
        "~^https?://localhost(:\d+)?$"           $http_origin;
        "~^https?://192\.168\.\d+\.\d+(:\d+)?$" $http_origin;
        default                                  "";
    }

    upstream authservice         { server authservice:8080; }
    upstream orderservice        { server orderservice:8080; }
    upstream notificationservice { server notificationservice:8080; }
    upstream m01service          { server m01service:8080; }
    upstream asyncgateway        { server asyncgateway:8080; }
    upstream datamatchingservice { server datamatchingservice:8080; }
    upstream dynamicformservice  { server dynamicformservice:8080; }
    upstream ocrservice          { server ocr-ocr-service-1:3003; }
    upstream frontend            { server host.docker.internal:4000; }

    # ── Monitoring server (internal Docker network only, not exposed to host) ──
    server {
        listen 8081;

        location /nginx_status {
            stub_status;
            # Allow only Docker bridge network ranges
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 10.0.0.0/8;
            allow 127.0.0.1;
            deny all;
        }
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 8080;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 8443 ssl;
        ssl_certificate     /etc/nginx/ssl/hdos.crt;
        ssl_certificate_key /etc/nginx/ssl/hdos.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        access_log /var/log/nginx/access.log main;

        # ── Strip CORS từ upstream (nginx là CORS authority duy nhất) ─────────
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Max-Age;

        # ── Proxy settings chung (kế thừa bởi mọi location không override) ───
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;

        # ── CORS response headers (kế thừa bởi location không có add_header) ─
        # Access-Control-Allow-Headers KHÔNG đặt ở đây — biến này chỉ có nghĩa
        # trong preflight, đặt ở server level gây gửi header rỗng với request thường.
        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods     "GET,POST,PUT,DELETE,PATCH,OPTIONS" always;
        add_header Vary                             Origin always;

        # ── Error pages chung ─────────────────────────────────────────────────
        # 418 là trigger nội bộ cho CORS preflight — client không bao giờ thấy status này
        error_page 418 = @cors_preflight;

        # ── CORS preflight handler dùng chung ────────────────────────────────
        # Mỗi location chỉ cần: if ($request_method = OPTIONS) { return 418; }
        # Access-Control-Allow-Headers chỉ cần trong preflight, không phải mọi response.
        location @cors_preflight {
            add_header Access-Control-Allow-Origin      $cors_origin;
            add_header Access-Control-Allow-Credentials true;
            add_header Access-Control-Allow-Methods     "GET,POST,PUT,DELETE,PATCH,OPTIONS";
            add_header Access-Control-Allow-Headers     "Authorization,Content-Type,Accept,X-Requested-With,ngrok-skip-browser-warning";
            add_header Access-Control-Max-Age           3600;
            add_header Vary                             Origin;
            return 204;
        }

        # ── Health check (giữ lại cho monitoring) ────────────────────────────
        location = /health {
            default_type application/json;
            return 200 '{"status":"OK","service":"nginx-gateway"}';
        }

        # ──────────────────────────────────────────────────────────────────────
        # AUTH MODEL: nginx KHÔNG check JWT/permission nữa.
        # Mỗi service tự validate JWT (Hdos.Common.Auth) và đọc claim "permission"
        # từ token (do AuthService nhồi vào khi /auth/login).
        # Nginx chỉ làm reverse proxy + CORS authority + TLS termination.
        # ──────────────────────────────────────────────────────────────────────

        # ── Auth service ──────────────────────────────────────────────────────
        location /auth/ {
            if ($request_method = OPTIONS) { return 418; }
            proxy_pass http://authservice;
        }

        # ── Order service ─────────────────────────────────────────────────────
        # `^~` để prefix match thắng regex /orders(...) bên dưới
        location ^~ /orders/swagger {
            proxy_pass http://orderservice;
        }

        location ~ ^/orders($|/) {
            if ($request_method = OPTIONS) { return 418; }
            proxy_pass http://orderservice;
        }

        # ── Notification service ──────────────────────────────────────────────
        location ^~ /notifications/swagger {
            proxy_pass http://notificationservice;
        }

        # SSE endpoint: token truyền qua ?access_token= query param và được xử lý
        # bởi JwtAuthExtensions.OnMessageReceived trong service.
        location = /notifications/sse {
            if ($request_method = OPTIONS) { return 418; }
            proxy_pass             http://notificationservice;
            proxy_buffering        off;
            proxy_read_timeout     24h;
            proxy_cache            off;
        }

        location ~ ^/notifications($|/) {
            if ($request_method = OPTIONS) { return 418; }
            proxy_pass http://notificationservice;
        }

        # ── M01 service ───────────────────────────────────────────────────────
        location ^~ /m01/swagger {
            proxy_pass http://m01service;
        }

        location ~ ^/m01($|/) {
            if ($request_method = OPTIONS) { return 418; }
            proxy_pass http://m01service;
        }

        # ── Data Matching Service ─────────────────────────────────────────
        location ^~ /dm/swagger {
            proxy_pass http://datamatchingservice;
        }

        location ~ ^/dm($|/) {
            if ($request_method = OPTIONS) { return 418; }
            proxy_pass http://datamatchingservice;
        }

        # ── Dynamic Form Service ──────────────────────────────────────────────
        location ^~ /forms/swagger {
            proxy_pass http://dynamicformservice;
        }

        location ~ ^/forms($|/) {
            if ($request_method = OPTIONS) { return 418; }
            proxy_pass http://dynamicformservice;
        }

        # ── Async Gateway (HTTP → RabbitMQ) ──────────────────────────────────
        location ^~ /async/swagger {
            proxy_pass http://asyncgateway;
        }

        location ~ ^/async($|/) {
            if ($request_method = OPTIONS) { return 418; }
            proxy_pass http://asyncgateway;
        }

        # ── OCR Service ───────────────────────────────────────────────────────
        # OCR service dùng setGlobalPrefix('ocr') → routes tại /ocr/...
        # proxy_pass KHÔNG trailing slash → nginx giữ nguyên path /ocr/... khi forward
        location = /ocr/swagger {
            return 301 /ocr/api/docs;
        }

        location ^~ /ocr/ {
            if ($request_method = OPTIONS) { return 418; }
            proxy_pass http://ocrservice;
        }

        # ── Next.js Frontend (catch-all — đứng sau tất cả API routes) ────────
        location / {
            proxy_pass http://frontend;
        }
    }
}
