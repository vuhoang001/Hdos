events {
    worker_connections 1024;
}

http {
    # ── Access log format for Promtail parsing ────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    # ── WebSocket upgrade ─────────────────────────────────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── CORS origin whitelist ─────────────────────────────────────────────────
    # Reflect origin chỉ khi nằm trong whitelist — KHÔNG phải echo-all.
    # Thêm production domain khi deploy (ví dụ: "~^https://app\.example\.com$").
    map $http_origin $cors_origin {
        "~^https?://localhost(:\d+)?$"           $http_origin;
        "~^https?://192\.168\.\d+\.\d+(:\d+)?$" $http_origin;
        default                                  "";
    }

    upstream authservice         { server authservice:8080; }
    upstream orderservice        { server orderservice:8080; }
    upstream notificationservice { server notificationservice:8080; }
    upstream m01service          { server m01service:8080; }
    upstream asyncgateway        { server asyncgateway:8080; }

    # ── Monitoring server (internal Docker network only, not exposed to host) ──
    server {
        listen 8081;

        location /nginx_status {
            stub_status;
            # Allow only Docker bridge network ranges
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 10.0.0.0/8;
            allow 127.0.0.1;
            deny all;
        }
    }

    server {
        listen 8080;
        access_log /var/log/nginx/access.log main;

        # ── Strip CORS từ upstream (nginx là CORS authority duy nhất) ─────────
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Max-Age;

        # ── Proxy settings chung (kế thừa bởi mọi location không override) ───
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;

        # ── CORS response headers (kế thừa bởi location không có add_header) ─
        # Access-Control-Allow-Headers KHÔNG đặt ở đây — biến này chỉ có nghĩa
        # trong preflight, đặt ở server level gây gửi header rỗng với request thường.
        add_header Access-Control-Allow-Origin      $cors_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods     "GET,POST,PUT,DELETE,PATCH,OPTIONS" always;
        add_header Vary                             Origin always;

        # ── Error pages chung (kế thừa bởi location không có error_page riêng) ─
        error_page 401 = @unauthorized;
        error_page 403 = @forbidden;
        # 418 là trigger nội bộ cho CORS preflight — client không bao giờ thấy status này
        error_page 418 = @cors_preflight;

        # ── CORS preflight handler dùng chung ────────────────────────────────
        # Mỗi location chỉ cần: if ($request_method = OPTIONS) { return 418; }
        # Access-Control-Allow-Headers chỉ cần trong preflight, không phải mọi response.
        location @cors_preflight {
            add_header Access-Control-Allow-Origin      $cors_origin;
            add_header Access-Control-Allow-Credentials true;
            add_header Access-Control-Allow-Methods     "GET,POST,PUT,DELETE,PATCH,OPTIONS";
            add_header Access-Control-Allow-Headers     "Authorization,Content-Type,Accept,X-Requested-With,ngrok-skip-browser-warning";
            add_header Access-Control-Max-Age           3600;
            add_header Vary                             Origin;
            return 204;
        }

        # ── Error response handlers ───────────────────────────────────────────
        location @unauthorized {
            default_type application/json;
            return 401 '{"error":"Unauthorized","message":"Valid JWT token required"}';
        }

        location @forbidden {
            default_type application/json;
            return 403 '{"error":"Forbidden","message":"Insufficient permissions"}';
        }

        # ── Gateway ───────────────────────────────────────────────────────────
        location = / {
            default_type application/json;
            return 200 '{"name":"Hdos API Gateway","routes":["/auth","/orders","/notifications","/m01","/async"]}';
        }

        location = /health {
            default_type application/json;
            return 200 '{"status":"OK","service":"nginx-gateway"}';
        }

        # ── Internal: JWT validation cho auth_request ─────────────────────────
        location = /_auth_validate {
            internal;
            proxy_pass              http://authservice/auth/validate;
            proxy_pass_request_body off;
            # Override proxy_set_header ở đây — subrequest chỉ cần hai header này
            proxy_set_header        Content-Length "";
            proxy_set_header        X-Original-URI $request_uri;
        }

        # ── Auth service (anonymous) ──────────────────────────────────────────
        location /auth/ {
            if ($request_method = OPTIONS) { return 418; }
            proxy_pass http://authservice;
        }

        # ── Order service ─────────────────────────────────────────────────────
        location ~ ^/orders(/health.*) {
            proxy_pass http://orderservice$1;
        }

        location /orders/swagger {
            proxy_pass http://orderservice;
        }

        location /orders/ {
            if ($request_method = OPTIONS) { return 418; }
            auth_request /_auth_validate;
            proxy_pass http://orderservice;
        }

        # ── Notification service ──────────────────────────────────────────────
        location ~ ^/notifications(/health.*) {
            proxy_pass http://notificationservice$1;
        }

        location /notifications/swagger {
            proxy_pass http://notificationservice;
        }

        # SignalR hub: KHÔNG dùng auth_request — WebSocket upgrade không thể gửi
        # Authorization header; token qua ?access_token= được xử lý bởi [Authorize]
        # + JwtAuthExtensions trong service.
        location /notifications/hubs/ {
            if ($request_method = OPTIONS) { return 418; }
            proxy_pass http://notificationservice;
        }

        location /notifications/ {
            if ($request_method = OPTIONS) { return 418; }
            auth_request /_auth_validate;
            proxy_pass http://notificationservice;
        }

        # ── M01 service ───────────────────────────────────────────────────────
        location ~ ^/m01(/health.*) {
            proxy_pass http://m01service$1;
        }

        location /m01/swagger {
            proxy_pass http://m01service;
        }

        location /m01/ {
            if ($request_method = OPTIONS) { return 418; }
            auth_request /_auth_validate;
            proxy_pass http://m01service;
        }

        # ── Async Gateway (HTTP → RabbitMQ) ──────────────────────────────────
        location ~ ^/async(/health.*) {
            proxy_pass http://asyncgateway$1;
        }

        location /async/swagger {
            proxy_pass http://asyncgateway;
        }

        location /async/ {
            if ($request_method = OPTIONS) { return 418; }
            auth_request /_auth_validate;
            proxy_pass http://asyncgateway;
        }
    }
}
