# CDC stack — chạy cùng với docker-compose.yml:
# docker compose -f docker-compose.yml -f docker-compose.kafka.yml up -d
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: hdos-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [hdos-net]

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: hdos-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:29092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [hdos-net]

  kafka-connect:
    image: debezium/connect:2.6
    container_name: hdos-kafka-connect
    depends_on:
      kafka:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: "kafka:29092"
      GROUP_ID: "hdos-connect"
      CONFIG_STORAGE_TOPIC: "hdos.connect.configs"
      OFFSET_STORAGE_TOPIC: "hdos.connect.offsets"
      STATUS_STORAGE_TOPIC: "hdos.connect.status"
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      # Expose để connector config dùng ${env:MSSQL_SA_PASSWORD} thay vì hardcode
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Hdos!DevPass123}"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks: [hdos-net]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: hdos-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: hdos
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: "http://kafka-connect:8083"
    networks: [hdos-net]

networks:
  hdos-net:
    external: true
