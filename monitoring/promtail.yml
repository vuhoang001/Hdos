server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Collect logs from the hdos-nginx container via Docker socket discovery.
  # Filters by container name so other service logs (which use Serilog→Loki) are not duplicated.
  - job_name: nginx
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["hdos-nginx"]
    relabel_configs:
      # Strip leading slash from container name (/hdos-nginx → hdos-nginx)
      - source_labels: [__meta_docker_container_name]
        regex: /(.+)
        target_label: container
      # Fixed service label for Loki/Grafana queries: {service="nginx"}
      - replacement: nginx
        target_label: service
    pipeline_stages:
      # Parse nginx combined log format to extract status code and request time
      - regex:
          expression: '(?P<remote_addr>\S+) \S+ \S+ \[(?P<time>[^\]]+)\] "(?P<method>\S+) (?P<path>\S+)[^"]*" (?P<status>\d+) \d+ "[^"]*" "[^"]*" rt=(?P<rt>\S+)'
      - labels:
          status:
          method:
